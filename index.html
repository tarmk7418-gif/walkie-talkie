<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VOX-ONE" />
  <title>VOX-ONE | 실시간 스마트 무전기</title>
  <link id="pwa-manifest" rel="manifest" />
  <!-- Supabase Realtime SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #131c31;
      --panel-light: #1e293b;
      --border: #283548;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #050811;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 0.98rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      min-width: 9px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      color: var(--text);
      background: var(--panel-light);
      border-radius: 10px;
      transition: transform 0.1s, background 0.15s;
    }

    button:active {
      transform: scale(0.97);
    }

    .icon-btn {
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }

    .view.active {
      display: flex;
    }

    .profile-bar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
    }

    .join-box {
      display: flex;
      gap: 8px;
    }

    .join-box input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: var(--accent);
      color: #082f49;
      font-weight: 800;
      padding: 9px 14px;
    }

    .section-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .channel-card:hover {
      border-color: var(--accent);
    }

    .channel-title {
      font-weight: 700;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .badge.drive { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .badge.work { background: rgba(245, 158, 11, 0.15); color: var(--amber); }

    .channel-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .enter-pill {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* Room View */
    .presence-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.76rem;
      gap: 6px;
    }

    .wake-badge {
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.16);
      color: var(--amber);
      white-space: nowrap;
      cursor: pointer;
    }

    .wake-badge.active {
      background: rgba(16, 185, 129, 0.18);
      color: var(--green);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--panel);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .mode-tab {
      padding: 8px 4px;
      font-size: 0.82rem;
      font-weight: 700;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
    }

    .mode-tab.active {
      background: var(--panel-light);
      color: var(--text);
    }

    .canvas-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    canvas {
      width: 100%;
      height: 68px;
      background: #080d1a;
      border-radius: 10px;
      display: block;
    }

    .mode-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .mode-panel.active {
      display: flex;
    }

    .sfx-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .sfx-btn {
      padding: 8px 4px;
      font-size: 0.76rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    #radarCanvas {
      height: 140px;
    }

    .drive-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      background: #0b1120;
      padding: 8px 10px;
      border-radius: 10px;
    }

    .mixer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
    }

    .mixer-row input[type="range"] {
      flex: 1;
      accent-color: var(--amber);
    }

    .log-list {
      flex: 1;
      min-height: 130px;
      max-height: 230px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.84rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-item.sos {
      border-color: var(--red);
      background: rgba(239, 68, 68, 0.14);
    }

    .log-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .play-chip {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 700;
    }

    /* PTT Deck */
    .ptt-deck {
      margin-top: auto;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .floor-status {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--green);
    }

    .floor-status.busy {
      color: var(--red);
      border-color: var(--red);
    }

    .ptt-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .side-action {
      width: 72px;
      height: 64px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--border);
    }

    .side-action.sos-btn {
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .ptt-main {
      flex: 1;
      height: 84px;
      border-radius: 22px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--accent);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 1.02rem;
      font-weight: 800;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .ptt-main.driving-size {
      height: 124px;
      font-size: 1.2rem;
      border-width: 3px;
    }

    .ptt-main.active {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      border-color: #fecaca;
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.65);
      transform: scale(0.98);
    }

    .ptt-main.locked {
      opacity: 0.5;
      border-color: var(--muted);
      box-shadow: none;
    }

    .ptt-sub {
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--muted);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 0.88rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand" id="headerTitle">
        <span class="status-dot" id="connDot"></span>
        <span id="headerText">VOX-ONE</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="backHomeBtn" style="display:none;" onclick="goHome()">← 나가기</button>
        <button class="icon-btn" onclick="openModal('serverModal')">⚙️ 서버설정</button>
      </div>
    </header>

    <!-- HOME VIEW -->
    <main id="homeView" class="view active">
      <div class="profile-bar">
        <div>
          <span style="color:var(--muted);">내 콜사인:</span>
          <strong id="myNicknameDisplay" style="color:var(--accent);">대원-101</strong>
        </div>
        <button class="icon-btn" onclick="changeNickname()">닉네임 변경</button>
      </div>

      <div class="join-box">
        <input id="joinCodeInput" type="text" maxlength="8" placeholder="채널 코드 입력 (예: 482910)" />
        <button class="btn-primary" onclick="joinByCode()">코드 입장</button>
      </div>

      <div class="section-label">
        <span>기본 채널 (같은 코드로 동시 접속)</span>
        <button class="icon-btn" onclick="openModal('createModal')">+ 채널 만들기</button>
      </div>

      <div id="channelList" style="display:flex; flex-direction:column; gap:10px;"></div>

      <div style="margin-top:auto; font-size:0.78rem; color:var(--muted); background:var(--panel); padding:11px 12px; border-radius:12px; border:1px solid var(--border); line-height:1.45;">
        📡 <strong id="serverStatusBanner" style="color:var(--green);">서버 연결 준비 중...</strong>
      </div>
    </main>

    <!-- ROOM VIEW -->
    <section id="roomView" class="view">
      <div class="presence-strip">
        <span id="onlineUsersText" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🟡 실시간 서버 접속 중...</span>
        <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
          <span id="wakeLockBadge" class="wake-badge" onclick="toggleWakeLockManual()">☀️ 화면유지 대기</span>
          <span id="roomCodeBadge" style="color:var(--accent); font-weight:800;">CODE: 482910</span>
        </div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="social" onclick="switchMode('social')">💬 일상 모드</button>
        <button class="mode-tab" data-mode="drive" onclick="switchMode('drive')">🚗 주행 모드</button>
        <button class="mode-tab" data-mode="work" onclick="switchMode('work')">🏢 업무 모드</button>
      </div>

      <div class="canvas-box">
        <canvas id="waveCanvas" width="420" height="68"></canvas>

        <!-- Social Mode -->
        <div id="panel-social" class="mode-panel active">
          <div class="section-label"><span>무전 효과음 패드 (채널 전체 송출)</span></div>
          <div class="sfx-grid">
            <button class="sfx-btn" onclick="sendSfxBroadcast('beep')">📡 호출음</button>
            <button class="sfx-btn" onclick="sendSfxBroadcast('roger')">📻 로저톤</button>
            <button class="sfx-btn" onclick="sendSfxBroadcast('alert')">⚠️ 주의알림</button>
            <button class="sfx-btn" onclick="sendSfxBroadcast('ok')">✅ 수신완료</button>
          </div>
        </div>

        <!-- Driving Mode -->
        <div id="panel-drive" class="mode-panel">
          <canvas id="radarCanvas" width="420" height="140"></canvas>
          <div class="drive-controls">
            <span id="gpsStatusText">📍 GPS 위치 공유 대기 중</span>
            <button class="icon-btn" id="bgmBtn" onclick="toggleBgm()">주행 BGM 덕킹</button>
          </div>
        </div>

        <!-- Business Mode -->
        <div id="panel-work" class="mode-panel">
          <div class="section-label">
            <span>다중 채널 수신 볼륨 믹서</span>
            <button class="play-chip" onclick="exportLogsCsv()">기록 CSV 저장</button>
          </div>
          <div class="mixer-row">
            <span>메인 무전 수신음</span>
            <input id="rxVolumeSlider" type="range" min="0" max="100" value="100" />
          </div>
        </div>
      </div>

      <div class="section-label">
        <span>실시간 무전 로그 & 자막 (STT)</span>
        <span style="color:var(--muted);">수신 시 자동 재생</span>
      </div>
      <div id="logList" class="log-list"></div>
    </section>

    <!-- PTT DECK -->
    <div id="pttDeck" class="ptt-deck" style="display:none;">
      <div id="floorStatus" class="floor-status">🟢 수신 대기 중 (발언 가능)</div>
      <div class="ptt-row">
        <button class="side-action" onclick="replayLast()">
          <span>↺</span>
          <span>다시듣기</span>
        </button>

        <button id="mainPttBtn" class="ptt-main">
          <span>🎙️ 꾹 눌러서 말하기</span>
          <span class="ptt-sub">누르는 동안 녹음 · 떼면 즉시 전송</span>
        </button>

        <button class="side-action sos-btn" onclick="triggerSos()">
          <span>🚨</span>
          <span>긴급SOS</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Server Config Modal -->
  <div id="serverModal" class="modal-backdrop">
    <div class="modal">
      <h3>🌐 실시간 서버(Supabase) 설정</h3>
      <p style="font-size:0.8rem; color:var(--muted); line-height:1.45;">
        정확한 프로젝트 주소와 Legacy anon 키가 기본 내장되어 있습니다.
      </p>
      <input id="sbUrlInput" type="text" placeholder="Project URL" />
      <input id="sbKeyInput" type="text" placeholder="anon public key (eyJh...)" />
      <div class="modal-actions">
        <button class="icon-btn" onclick="resetServerConfig()">기본값 복원</button>
        <button class="icon-btn" onclick="closeModal('serverModal')">닫기</button>
        <button class="btn-primary" onclick="saveServerConfig()">저장 및 재연결</button>
      </div>
    </div>
  </div>

  <!-- Create Channel Modal -->
  <div id="createModal" class="modal-backdrop">
    <div class="modal">
      <h3>새 무전 채널 만들기</h3>
      <input id="newChanName" type="text" placeholder="채널 이름 (예: 주말 투어링 B조)" />
      <input id="newChanCode" type="text" maxlength="8" placeholder="공유할 채널 코드 (비워두면 자동생성)" />
      <select id="newChanType">
        <option value="social">일상 · 소셜 채널</option>
        <option value="drive">주행 · 아웃도어 채널</option>
        <option value="work">현장 · 비즈니스 채널</option>
      </select>
      <div class="modal-actions">
        <button class="icon-btn" onclick="closeModal('createModal')">취소</button>
        <button class="btn-primary" onclick="createChannel()">생성 및 입장</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 정확한 Supabase Project URL 및 Legacy anon 키 (자동 연결 완료)
    // =========================================================================
    const DEFAULT_SUPABASE_URL = "https://xhnncyvxlfrahqechpxe.supabase.co";
    const DEFAULT_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhobm5jeXZ4bGZyYWhxZWNocHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MzAxMTgsImV4cCI6MjExMTIwNjExOH0.KRNqcgNTO6yyTm6zlUcHxf05qWVm1s0rK7Fb57d7a2Q";

    // 1. Dynamic PWA Manifest
    (function setupPwaManifest() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f172a"/><circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="28"/><circle cx="256" cy="256" r="64" fill="#ef4444"/></svg>`;
      const iconUrl = "data:image/svg+xml;base64," + btoa(svgIcon);
      const manifest = {
        name: "VOX-ONE 실시간 무전기",
        short_name: "VOX-ONE",
        start_url: "./",
        display: "standalone",
        background_color: "#0b1120",
        theme_color: "#0f172a",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      document.getElementById("pwa-manifest").setAttribute("href", URL.createObjectURL(blob));
    })();

    // 2. Unique Session Identity
    const deviceUid = localStorage.getItem("vox_uid") || ("d_" + Math.random().toString(36).slice(2, 8));
    localStorage.setItem("vox_uid", deviceUid);
    const tabUid = sessionStorage.getItem("vox_tab_uid") || ("t_" + Math.random().toString(36).slice(2, 8));
    sessionStorage.setItem("vox_tab_uid", tabUid);
    const myUserId = `${deviceUid}_${tabUid}`;

    let myNickname = localStorage.getItem("vox_nick") || ("대원-" + Math.floor(100 + Math.random() * 900));
    document.getElementById("myNicknameDisplay").textContent = myNickname;

    // Auto-clear outdated URL or publishable key from previous sessions
    let savedUrl = localStorage.getItem("vox_sb_url");
    let savedKey = localStorage.getItem("vox_sb_key");
    if (savedUrl && savedUrl.includes("xhnncyvsifrahqechpxe")) {
      localStorage.removeItem("vox_sb_url");
      savedUrl = null;
    }
    if (savedKey && savedKey.startsWith("sb_publishable_")) {
      localStorage.removeItem("vox_sb_key");
      savedKey = null;
    }

    let sbUrl = savedUrl || DEFAULT_SUPABASE_URL;
    let sbKey = savedKey || DEFAULT_SUPABASE_KEY;
    let supabaseClient = null;
    let realtimeRoom = null;

    function initSupabase() {
      const dot = document.getElementById("connDot");
      const banner = document.getElementById("serverStatusBanner");
      if (sbUrl && sbKey && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(sbUrl.trim(), sbKey.trim(), {
            realtime: { params: { eventsPerSecond: 10 } }
          });
          dot.classList.add("online");
          banner.style.color = "var(--green)";
          banner.textContent = "🟢 실시간 클라이언트 준비됨 — 채널 입장 시 자동 동기화됩니다.";
        } catch (e) {
          dot.classList.remove("online");
          banner.style.color = "var(--red)";
          banner.textContent = "⚠️ Supabase 초기화 오류: URL과 키를 다시 확인해 주세요.";
        }
      } else {
        dot.classList.remove("online");
        banner.style.color = "var(--amber)";
        banner.textContent = "로컬 단독 모드 (상단 ⚙️ 서버설정에서 키를 입력해 주세요)";
      }
    }

    function saveServerConfig() {
      sbUrl = document.getElementById("sbUrlInput").value.trim() || DEFAULT_SUPABASE_URL;
      sbKey = document.getElementById("sbKeyInput").value.trim() || DEFAULT_SUPABASE_KEY;
      localStorage.setItem("vox_sb_url", sbUrl);
      localStorage.setItem("vox_sb_key", sbKey);
      closeModal("serverModal");
      initSupabase();
      if (activeChannel) {
        reconnectCurrentChannel();
      }
    }

    function resetServerConfig() {
      localStorage.removeItem("vox_sb_url");
      localStorage.removeItem("vox_sb_key");
      sbUrl = DEFAULT_SUPABASE_URL;
      sbKey = DEFAULT_SUPABASE_KEY;
      document.getElementById("sbUrlInput").value = sbUrl;
      document.getElementById("sbKeyInput").value = sbKey;
      initSupabase();
      if (activeChannel) {
        reconnectCurrentChannel();
      }
    }

    function changeNickname() {
      const next = prompt("사용할 콜사인(닉네임)을 입력하세요:", myNickname);
      if (next && next.trim()) {
        myNickname = next.trim().slice(0, 14);
        localStorage.setItem("vox_nick", myNickname);
        document.getElementById("myNicknameDisplay").textContent = myNickname;
      }
    }

    // 3. Screen Wake Lock API (Prevent Screen Off)
    let wakeLockSentinel = null;
    let wakeLockEnabled = true;

    async function requestWakeLock() {
      const badge = document.getElementById("wakeLockBadge");
      if (!("wakeLock" in navigator)) {
        badge.textContent = "🌙 화면유지 미지원";
        badge.classList.remove("active");
        return;
      }
      if (!wakeLockEnabled || !activeChannel) return;

      try {
        wakeLockSentinel = await navigator.wakeLock.request("screen");
        badge.textContent = "☀️ 화면유지 ON";
        badge.classList.add("active");

        wakeLockSentinel.addEventListener("release", () => {
          if (badge && activeChannel) {
            badge.textContent = "☀️ 화면유지 대기";
            badge.classList.remove("active");
          }
        });
      } catch (err) {
        badge.textContent = "☀️ 터치 시 화면유지";
        badge.classList.remove("active");
      }
    }

    async function releaseWakeLock() {
      if (wakeLockSentinel) {
        try {
          await wakeLockSentinel.release();
        } catch (e) {}
        wakeLockSentinel = null;
      }
      const badge = document.getElementById("wakeLockBadge");
      if (badge) {
        badge.textContent = "☀️ 화면유지 대기";
        badge.classList.remove("active");
      }
    }

    async function toggleWakeLockManual() {
      wakeLockEnabled = !wakeLockEnabled;
      if (wakeLockEnabled) {
        await requestWakeLock();
      } else {
        await releaseWakeLock();
        document.getElementById("wakeLockBadge").textContent = "🌙 화면유지 OFF";
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && activeChannel && wakeLockEnabled) {
        requestWakeLock();
      }
    });

    // 4. Channels & Room Lifecycle
    const channels = [
      { id: "c1", name: "주말 투어링 A조", type: "drive", code: "482910" },
      { id: "c2", name: "1층 홀/주방 스태프", type: "work", code: "910342" },
      { id: "c3", name: "우리 가족 무전기", type: "social", code: "112094" }
    ];

    let activeChannel = null;
    let currentMode = "social";
    let onlinePeers = [];
    let remoteSpeaker = null;
    let speakerTimeout = null;
    let logs = [];
    let myGps = null;
    let gpsWatchId = null;

    function renderChannels() {
      const list = document.getElementById("channelList");
      list.innerHTML = "";
      channels.forEach(ch => {
        const badgeLabel = ch.type === "drive" ? "주행" : ch.type === "work" ? "업무" : "일상";
        const card = document.createElement("div");
        card.className = "channel-card";
        card.onclick = () => enterRoom(ch);
        card.innerHTML = `
          <div>
            <div class="channel-title">
              <span>${ch.name}</span>
              <span class="badge ${ch.type}">${badgeLabel}</span>
            </div>
            <div class="channel-meta">공유 코드: <strong style="color:var(--text);">${ch.code}</strong></div>
          </div>
          <span class="enter-pill">무전 입장 →</span>
        `;
        list.appendChild(card);
      });
    }

    function joinByCode() {
      const raw = document.getElementById("joinCodeInput").value.trim().toUpperCase();
      if (!raw) return;
      let found = channels.find(c => c.code === raw);
      if (!found) {
        found = { id: "custom_" + raw, name: `무전 채널 #${raw}`, type: "social", code: raw };
        channels.unshift(found);
        renderChannels();
      }
      document.getElementById("joinCodeInput").value = "";
      enterRoom(found);
    }

    function createChannel() {
      const name = document.getElementById("newChanName").value.trim() || "새 무전 채널";
      const codeInput = document.getElementById("newChanCode").value.trim().toUpperCase();
      const code = codeInput || Math.floor(100000 + Math.random() * 900000).toString();
      const type = document.getElementById("newChanType").value;
      const ch = { id: "c" + Date.now(), name, type, code };
      channels.unshift(ch);
      renderChannels();
      closeModal("createModal");
      enterRoom(ch);
    }

    function enterRoom(ch) {
      ensureAudioCtx();
      activeChannel = ch;
      logs = [];
      onlinePeers = [];
      remoteSpeaker = null;

      document.getElementById("homeView").classList.remove("active");
      document.getElementById("roomView").classList.add("active");
      document.getElementById("pttDeck").style.display = "flex";
      document.getElementById("backHomeBtn").style.display = "inline-block";
      document.getElementById("headerText").textContent = ch.name;
      document.getElementById("roomCodeBadge").textContent = `CODE: ${ch.code}`;

      switchMode(ch.type);
      renderLogs();
      connectRealtimeChannel(ch.code);
      startGpsTracking();
      requestWakeLock();
    }

    async function reconnectCurrentChannel() {
      if (!activeChannel) return;
      if (realtimeRoom && supabaseClient) {
        await supabaseClient.removeChannel(realtimeRoom);
        realtimeRoom = null;
      }
      connectRealtimeChannel(activeChannel.code);
    }

    async function goHome() {
      if (isTransmitting) stopTransmit();
      if (realtimeRoom && supabaseClient) {
        await supabaseClient.removeChannel(realtimeRoom);
        realtimeRoom = null;
      }
      if (gpsWatchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      await releaseWakeLock();
      activeChannel = null;
      document.getElementById("roomView").classList.remove("active");
      document.getElementById("homeView").classList.add("active");
      document.getElementById("pttDeck").style.display = "none";
      document.getElementById("backHomeBtn").style.display = "none";
      document.getElementById("headerText").textContent = "VOX-ONE";
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      document.querySelectorAll(".mode-panel").forEach(p => p.classList.remove("active"));
      document.getElementById(`panel-${mode}`).classList.add("active");
      document.getElementById("mainPttBtn").classList.toggle("driving-size", mode === "drive");
    }

    // 5. Supabase Realtime Channel
    function connectRealtimeChannel(code) {
      const statusEl = document.getElementById("onlineUsersText");
      if (!supabaseClient) {
        statusEl.textContent = `🟡 로컬 모드: ${myNickname} (1명)`;
        return;
      }

      statusEl.textContent = "🟡 실시간 서버 접속 중...";

      realtimeRoom = supabaseClient.channel(`vox-room-${code}`, {
        config: {
          broadcast: { self: false },
          presence: { key: myUserId }
        }
      });

      realtimeRoom.on("presence", { event: "sync" }, () => {
        const state = realtimeRoom.presenceState();
        const peers = [];
        Object.keys(state).forEach(uid => {
          const entries = state[uid];
          if (entries && entries.length > 0) {
            peers.push(entries[entries.length - 1]);
          }
        });
        onlinePeers = peers;
        const names = peers.map(p => p.nickname).join(", ");
        statusEl.textContent = `🟢 접속 ${peers.length}명 (${names})`;
      });

      realtimeRoom.on("broadcast", { event: "floor" }, ({ payload }) => {
        if (payload.state === "speaking") {
          remoteSpeaker = payload.nickname;
          updateFloorUi();
          clearTimeout(speakerTimeout);
          speakerTimeout = setTimeout(() => {
            remoteSpeaker = null;
            updateFloorUi();
          }, 32000);
        } else {
          remoteSpeaker = null;
          clearTimeout(speakerTimeout);
          updateFloorUi();
        }
      });

      realtimeRoom.on("broadcast", { event: "voice" }, ({ payload }) => {
        remoteSpeaker = null;
        updateFloorUi();

        const now = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
        const entry = {
          id: payload.id || Date.now(),
          sender: payload.nickname || "상대방",
          time: now,
          text: payload.text || "(실시간 음성 무전)",
          audioDataUrl: payload.audioDataUrl || null,
          sos: !!payload.sos
        };
        logs.unshift(entry);
        renderLogs();

        if (entry.sos) {
          playSfx("alert");
        } else {
          playStartChirp();
        }

        if (entry.audioDataUrl) {
          setTimeout(() => playRadioAudio(entry.audioDataUrl), 140);
        } else {
          setTimeout(playRogerBeep, 200);
        }
      });

      realtimeRoom.on("broadcast", { event: "sfx" }, ({ payload }) => {
        playSfx(payload.kind);
      });

      realtimeRoom.subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          statusEl.textContent = `🟢 접속 1명 (${myNickname})`;
          await realtimeRoom.track({
            userId: myUserId,
            nickname: myNickname,
            gps: myGps,
            onlineAt: Date.now()
          });
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          statusEl.textContent = `🔴 연결 실패(${status}) · 잠시 후 재시도`;
        }
      });
    }

    function updateFloorUi() {
      const status = document.getElementById("floorStatus");
      const pttBtn = document.getElementById("mainPttBtn");
      if (isTransmitting) {
        status.classList.add("busy");
        status.textContent = "🔴 내가 송신 중... (말씀하세요)";
        pttBtn.classList.add("active");
        pttBtn.classList.remove("locked");
      } else if (remoteSpeaker) {
        status.classList.add("busy");
        status.textContent = `🟠 ${remoteSpeaker}님 송신 중... (수신 대기)`;
        pttBtn.classList.remove("active");
        pttBtn.classList.add("locked");
      } else {
        status.classList.remove("busy");
        status.textContent = "🟢 수신 대기 중 (발언 가능)";
        pttBtn.classList.remove("active", "locked");
      }
    }

    // 6. Web Audio Engine
    let audioCtx = null;
    let bgmOsc = null;
    let bgmGain = null;
    let isBgmOn = false;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = "sine", vol = 0.16, delay = 0) {
      ensureAudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playStartChirp() {
      playTone(980, 0.07, "sine", 0.15, 0);
      playTone(1320, 0.09, "sine", 0.15, 0.07);
    }

    function playRogerBeep() {
      playTone(1200, 0.08, "triangle", 0.14, 0);
      playTone(880, 0.12, "triangle", 0.14, 0.08);
      ensureAudioCtx();
      const bufferSize = audioCtx.sampleRate * 0.11;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1800;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.07, audioCtx.currentTime + 0.16);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.27);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(audioCtx.currentTime + 0.16);
    }

    function playSfx(kind) {
      if (kind === "beep") { playTone(1050, 0.12); playTone(1050, 0.12, "sine", 0.16, 0.16); }
      if (kind === "roger") playRogerBeep();
      if (kind === "alert") { playTone(740, 0.18, "sawtooth", 0.14); playTone(560, 0.22, "sawtooth", 0.14, 0.2); }
      if (kind === "ok") { playTone(660, 0.09); playTone(990, 0.15, "sine", 0.16, 0.1); }
    }

    function sendSfxBroadcast(kind) {
      playSfx(kind);
      if (realtimeRoom) {
        realtimeRoom.send({ type: "broadcast", event: "sfx", payload: { kind } });
      }
    }

    function toggleBgm() {
      ensureAudioCtx();
      const btn = document.getElementById("bgmBtn");
      if (!isBgmOn) {
        bgmOsc = audioCtx.createOscillator();
        bgmGain = audioCtx.createGain();
        bgmOsc.type = "triangle";
        bgmOsc.frequency.value = 146.83;
        bgmGain.gain.value = 0.08;
        bgmOsc.connect(bgmGain);
        bgmGain.connect(audioCtx.destination);
        bgmOsc.start();
        isBgmOn = true;
        btn.textContent = "BGM 끄기 (재생중)";
      } else {
        bgmOsc.stop();
        isBgmOn = false;
        btn.textContent = "주행 BGM 덕킹";
      }
    }

    function duckBgm(duck) {
      if (isBgmOn && bgmGain && audioCtx) {
        bgmGain.gain.setTargetAtTime(duck ? 0.012 : 0.08, audioCtx.currentTime, 0.08);
      }
    }

    // 7. PTT Recording & Real-Time Transmission
    let isTransmitting = false;
    let mediaRecorder = null;
    let recordedMimeType = "";
    let audioChunks = [];
    let analyser = null;
    let micStream = null;
    let recognition = null;
    let liveTranscript = "";
    let maxDurationTimer = null;

    function getSupportedMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/ogg;codecs=opus"
      ];
      for (const type of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
      }
      return "";
    }

    async function startTransmit() {
      if (isTransmitting || remoteSpeaker) return;
      requestWakeLock();
      isTransmitting = true;
      liveTranscript = "";
      audioChunks = [];
      updateFloorUi();

      playStartChirp();
      duckBgm(true);

      if (realtimeRoom) {
        realtimeRoom.send({
          type: "broadcast",
          event: "floor",
          payload: { state: "speaking", userId: myUserId, nickname: myNickname }
        });
      }

      maxDurationTimer = setTimeout(() => {
        if (isTransmitting) stopTransmit();
      }, 30000);

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        try {
          recognition = new SpeechRec();
          recognition.lang = "ko-KR";
          recognition.interimResults = true;
          recognition.onresult = (e) => {
            let text = "";
            for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
            liveTranscript = text;
          };
          recognition.start();
        } catch (err) {}
      }

      try {
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        ensureAudioCtx();
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source.connect(analyser);

        recordedMimeType = getSupportedMimeType();
        const options = recordedMimeType
          ? { mimeType: recordedMimeType, audioBitsPerSecond: 16000 }
          : { audioBitsPerSecond: 16000 };

        mediaRecorder = new MediaRecorder(micStream, options);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = finalizeAndSendVoice;
        mediaRecorder.start(200);
      } catch (err) {
        mediaRecorder = null;
      }
    }

    function stopTransmit() {
      if (!isTransmitting) return;
      isTransmitting = false;
      clearTimeout(maxDurationTimer);
      updateFloorUi();

      playRogerBeep();
      duckBgm(false);

      if (realtimeRoom) {
        realtimeRoom.send({
          type: "broadcast",
          event: "floor",
          payload: { state: "idle", userId: myUserId, nickname: myNickname }
        });
      }

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      } else {
        finalizeAndSendVoice();
      }
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    async function finalizeAndSendVoice() {
      let audioDataUrl = null;
      if (audioChunks.length > 0) {
        const blob = new Blob(audioChunks, { type: recordedMimeType || "audio/webm" });
        audioDataUrl = await blobToDataUrl(blob);
      }

      const now = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      const text = liveTranscript.trim() || "(음성 무전 송출 완료)";
      const msgId = Date.now();

      logs.unshift({
        id: msgId,
        sender: `${myNickname} (나)`,
        time: now,
        text,
        audioDataUrl,
        sos: false
      });
      renderLogs();

      if (realtimeRoom) {
        const safeAudio = audioDataUrl && audioDataUrl.length < 245000 ? audioDataUrl : null;
        await realtimeRoom.send({
          type: "broadcast",
          event: "voice",
          payload: {
            id: msgId,
            senderId: myUserId,
            nickname: myNickname,
            text: safeAudio ? text : text + " (용량 초과로 텍스트만 전송됨)",
            audioDataUrl: safeAudio,
            sos: false
          }
        });
      }
    }

    async function playRadioAudio(dataUrl) {
      if (!dataUrl) {
        playRogerBeep();
        return;
      }
      ensureAudioCtx();
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }
      duckBgm(true);
      const volSlider = document.getElementById("rxVolumeSlider");
      const vol = volSlider ? Number(volSlider.value) / 100 : 1;

      try {
        const res = await fetch(dataUrl);
        const arrayBuf = await res.arrayBuffer();
        const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuf;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1450;
        filter.Q.value = 1.0;

        const gainNode = audioCtx.createGain();
        gainNode.gain.value = vol;

        src.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        src.onended = () => {
          playRogerBeep();
          duckBgm(false);
        };
        src.start(0);
      } catch (e) {
        const audio = new Audio(dataUrl);
        audio.volume = vol;
        audio.onended = () => {
          playRogerBeep();
          duckBgm(false);
        };
        audio.play().catch(() => duckBgm(false));
      }
    }

    function replayLast() {
      const target = logs.find(l => l.audioDataUrl) || logs[0];
      if (target && target.audioDataUrl) {
        playRadioAudio(target.audioDataUrl);
      } else {
        playStartChirp();
        setTimeout(playRogerBeep, 300);
      }
    }

    async function triggerSos() {
      playSfx("alert");
      const now = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      const gpsText = myGps ? ` (위도 ${myGps.lat.toFixed(4)}, 경도 ${myGps.lng.toFixed(4)})` : "";
      const text = `🚨 긴급 SOS 호출! 즉시 응답 바랍니다.${gpsText}`;

      logs.unshift({
        id: Date.now(),
        sender: `${myNickname} (SOS)`,
        time: now,
        text,
        audioDataUrl: null,
        sos: true
      });
      renderLogs();

      if (realtimeRoom) {
        await realtimeRoom.send({
          type: "broadcast",
          event: "voice",
          payload: {
            id: Date.now(),
            senderId: myUserId,
            nickname: myNickname,
            text,
            audioDataUrl: null,
            sos: true
          }
        });
      }
    }

    function renderLogs() {
      const list = document.getElementById("logList");
      if (!list) return;
      if (logs.length === 0) {
        list.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.8rem; padding:24px 0;">하단 버튼을 꾹 눌러 첫 무전을 송출하세요.</div>`;
        return;
      }
      list.innerHTML = "";
      logs.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "log-item" + (item.sos ? " sos" : "");
        div.innerHTML = `
          <div class="log-top">
            <strong>${item.sender} · ${item.time}</strong>
            <button class="play-chip" data-idx="${idx}">▶ 무전재생</button>
          </div>
          <div>${item.text}</div>
        `;
        div.querySelector(".play-chip").onclick = () => playRadioAudio(item.audioDataUrl);
        list.appendChild(div);
      });
    }

    // 8. Real GPS Tracking
    function startGpsTracking() {
      if (!navigator.geolocation) return;
      gpsWatchId = navigator.geolocation.watchPosition(
        async (pos) => {
          myGps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          document.getElementById("gpsStatusText").textContent =
            `📍 내 GPS 활성 (${myGps.lat.toFixed(3)}, ${myGps.lng.toFixed(3)})`;
          if (realtimeRoom) {
            await realtimeRoom.track({
              userId: myUserId,
              nickname: myNickname,
              gps: myGps,
              onlineAt: Date.now()
            });
          }
        },
        () => {
          document.getElementById("gpsStatusText").textContent = "📍 GPS 권한 미허용 (레이더 기본 표시)";
        },
        { enableHighAccuracy: true, maximumAge: 5000 }
      );
    }

    function calcDistanceMeters(g1, g2) {
      if (!g1 || !g2) return null;
      const R = 6371000;
      const dLat = ((g2.lat - g1.lat) * Math.PI) / 180;
      const dLng = ((g2.lng - g1.lng) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos((g1.lat * Math.PI) / 180) *
          Math.cos((g2.lat * Math.PI) / 180) *
          Math.sin(dLng / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // 9. Export CSV
    function exportLogsCsv() {
      const rows = [["발신자", "시간", "무전내용"]];
      logs.forEach(l => rows.push([l.sender, l.time, `"${l.text.replace(/"/g, '""')}"`]));
      const csvContent = "\uFEFF" + rows.map(e => e.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `VOX_ONE_${activeChannel ? activeChannel.code : "LOG"}.csv`;
      link.click();
    }

    // 10. Modals
    function openModal(id) {
      if (id === "serverModal") {
        document.getElementById("sbUrlInput").value = sbUrl;
        document.getElementById("sbKeyInput").value = sbKey;
      }
      document.getElementById(id).classList.add("open");
    }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }

    // 11. Waveform & Radar Animation
    const waveCanvas = document.getElementById("waveCanvas");
    const wCtx = waveCanvas.getContext("2d");
    const radarCanvas = document.getElementById("radarCanvas");
    const rCtx = radarCanvas.getContext("2d");
    let radarAngle = 0;

    function animateCanvases() {
      wCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
      const bars = 36;
      const barW = waveCanvas.width / bars;
      let freqData = null;
      if (isTransmitting && analyser) {
        freqData = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(freqData);
      }
      for (let i = 0; i < bars; i++) {
        let amp = 4;
        if (isTransmitting) {
          amp = freqData ? Math.max(6, (freqData[i] / 255) * 56) : (8 + Math.random() * 44);
        } else if (remoteSpeaker) {
          amp = 8 + Math.abs(Math.sin(Date.now() * 0.01 + i)) * 32;
        }
        wCtx.fillStyle = isTransmitting ? "#ef4444" : remoteSpeaker ? "#f59e0b" : "#38bdf8";
        const x = i * barW + 3;
        const y = (waveCanvas.height - amp) / 2;
        wCtx.fillRect(x, y, barW - 6, amp);
      }

      if (currentMode === "drive") {
        const w = radarCanvas.width;
        const h = radarCanvas.height;
        const cx = w / 2;
        const cy = h / 2;
        rCtx.clearRect(0, 0, w, h);

        rCtx.strokeStyle = "#1e293b";
        [26, 54].forEach(r => {
          rCtx.beginPath();
          rCtx.arc(cx, cy, r, 0, Math.PI * 2);
          rCtx.stroke();
        });

        radarAngle += 0.03;
        rCtx.strokeStyle = "rgba(16, 185, 129, 0.5)";
        rCtx.beginPath();
        rCtx.moveTo(cx, cy);
        rCtx.lineTo(cx + Math.cos(radarAngle) * 58, cy + Math.sin(radarAngle) * 58);
        rCtx.stroke();

        rCtx.fillStyle = "#38bdf8";
        rCtx.beginPath();
        rCtx.arc(cx, cy, 5, 0, Math.PI * 2);
        rCtx.fill();

        const others = onlinePeers.filter(p => p.userId !== myUserId);
        others.forEach((peer, i) => {
          const angle = (i * 2.1) + 0.8;
          const distM = calcDistanceMeters(myGps, peer.gps);
          const radius = distM !== null ? Math.min(52, Math.max(18, distM / 20)) : 34;
          const px = cx + Math.cos(angle) * radius;
          const py = cy + Math.sin(angle) * radius;
          const isFar = distM !== null && distM > 1000;

          rCtx.fillStyle = isFar ? "#f59e0b" : "#10b981";
          rCtx.beginPath();
          rCtx.arc(px, py, 4, 0, Math.PI * 2);
          rCtx.fill();

          rCtx.fillStyle = "#cbd5e1";
          rCtx.font = "11px sans-serif";
          const distLabel = distM !== null ? ` (${distM >= 1000 ? (distM/1000).toFixed(1)+"km" : distM+"m"})` : "";
          rCtx.fillText(`${peer.nickname}${distLabel}`, px + 7, py + 4);
        });
      }

      requestAnimationFrame(animateCanvases);
    }

    // 12. Pointer & Keyboard PTT Controls
    const mainPttBtn = document.getElementById("mainPttBtn");
    mainPttBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      mainPttBtn.setPointerCapture(e.pointerId);
      startTransmit();
    });
    mainPttBtn.addEventListener("pointerup", (e) => {
      e.preventDefault();
      stopTransmit();
    });
    mainPttBtn.addEventListener("pointercancel", stopTransmit);
    mainPttBtn.addEventListener("contextmenu", (e) => e.preventDefault());

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && document.activeElement.tagName !== "INPUT" && activeChannel) {
        e.preventDefault();
        startTransmit();
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "Space" && isTransmitting) {
        e.preventDefault();
        stopTransmit();
      }
    });

    // Boot
    initSupabase();
    renderChannels();
    animateCanvases();
  </script>
</body>
</html>
